name: iArchitect
options:
  bundleIdPrefix: com.iarchitect
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  iArchitect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iArchitect
        excludes:
          - "**/*.md"
    resources:
      - path: iArchitect/Assets.xcassets
      - path: "iArchitect/Preview Content"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iarchitect.app
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: iArchitect/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        ENABLE_PREVIEWS: YES
